name: "HAVY Antigravity LAB Worker"
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Gói công việc"
        required: true
        type: choice
        options: [P04_CONTENT, P05_UX, P06_FOUNDATION, P07_FIX]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: havy-agent-${{ github.event.inputs.phase }}
  cancel-in-progress: false
jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/smart-website-factory-v1
          persist-credentials: false
      - name: Check secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || { echo "::error::Add GEMINI_API_KEY in GitHub Actions Secrets"; exit 1; }
      - name: Install Antigravity CLI
        run: |
          set -euo pipefail
          curl -fsSL https://antigravity.google/cli/install.sh -o "$RUNNER_TEMP/install-agy.sh"
          bash "$RUNNER_TEMP/install-agy.sh"
          "$HOME/.local/bin/agy" --version
      - name: Configure limited permissions
        run: |
          mkdir -p "$HOME/.gemini/antigravity-cli"
          cat > "$HOME/.gemini/antigravity-cli/settings.json" <<'JSON'
          {"modelProvider":"gemini","permissions":{"allow":["command(regex:npm (install|ci))","command(regex:npm run (build|lint|test|typecheck))","write_file(src/)","write_file(public/)","write_file(index.html)","write_file(package.json)","write_file(docs/)"]}}
          JSON
      - name: Run worker and stream progress
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PHASE: ${{ github.event.inputs.phase }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          { cat docs/ANTIGRAVITY_WORK_ORDER.md; printf '\nCURRENT PHASE: %s\n' "$PHASE"; } > "$RUNNER_TEMP/order.txt"
          agy -p "$(cat "$RUNNER_TEMP/order.txt")" --output-format stream-json --print-timeout 12m | tee "$RUNNER_TEMP/events.ndjson"
          jq -e -s '([.[] | select(.event=="result") | .result.status] | last) == "SUCCESS"' "$RUNNER_TEMP/events.ndjson"
      - name: Validate build and tests
        run: |
          set -euo pipefail
          test -f package.json || { echo "::error::No runnable application"; exit 1; }
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          node -e "const p=require('./package.json');if(!p.scripts?.build||!p.scripts?.test)throw Error('Missing build/test scripts')"
          npm run build
          CI=true npm test
          npm run lint --if-present
          npm run typecheck --if-present
      - name: Fail on protected file changes
        run: |
          set -euo pipefail
          if git status --porcelain | grep -E '(\.github/|\.gemini/|gha-creds-|(^|/)\.env)'; then
            echo "::error::Unauthorized config/credential changes"
            exit 1
          fi
      - name: Push isolated branch and create LAB pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHASE: ${{ github.event.inputs.phase }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then echo "No changes"; exit 0; fi
          git config user.name "havy-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="agent/havy-$RUN_ID"
          git switch -c "$BRANCH"
          git add -A
          if git diff --cached --name-only | grep -E '(^\.github/|^\.gemini/|^gha-creds-|(^|/)\.env)'; then exit 1; fi
          git commit -m "agent: HAVY $PHASE"
          gh auth setup-git
          git push origin "$BRANCH"
          gh pr create --base lab/smart-website-factory-v1 --head "$BRANCH" --title "LAB: $PHASE" --body "Generated by Antigravity; requires independent KCS; no auto-merge to main."
