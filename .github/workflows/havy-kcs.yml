name: "HAVY Independent KCS"
on:
  pull_request:
    branches: [lab/smart-website-factory-v1]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build/test quality gate
        run: |
          set -euo pipefail
          test -f package.json
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          node -e "const p=require('./package.json');if(!p.scripts?.build||!p.scripts?.test)throw Error('Missing build/test scripts')"
          npm run build
          CI=true npm test
          npm run lint --if-present
          npm run typecheck --if-present
