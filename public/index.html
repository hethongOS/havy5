<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hermes Chat</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;⚡&lt;/text&gt;&lt;/svg&gt;" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <div class="avatar" aria-hidden="true">⚡</div>
        <div>
          <h1>Hermes</h1>
          <p id="status" class="status">Đang kết nối…</p>
        </div>
      </div>
      <div class="header-actions">
        <a class="clear-btn nav-link" href="office.html" title="Phòng làm việc chung nhiều AI">🏢 Văn phòng ảo</a>
        <a class="clear-btn nav-link" href="arena.html" title="Xem hai AI tranh luận">⚔️ Phòng tranh luận</a>
        <button id="clear-btn" class="clear-btn" title="Xoá cuộc trò chuyện">Cuộc trò chuyện mới</button>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite">
      <div class="welcome">
        <div class="welcome-icon">⚡</div>
        <h2>Chào bạn, mình là Hermes!</h2>
        <p>Người bạn AI của bạn — hỏi gì cũng được!</p>
        <div class="suggestions">
          <button class="chip">Kể mình một sự thật thú vị đi</button>
          <button class="chip">Viết giúp mình một bài thơ ngắn</button>
          <button class="chip">Gợi ý món ăn tối nay nhé</button>
          <button class="chip">AI hoạt động như thế nào vậy?</button>
        </div>
      </div>
    </main>

    <footer class="composer">
      <form id="chat-form">
        <textarea
          id="input"
          rows="1"
          placeholder="Nhắn tin cho Hermes…"
          autocomplete="off"
          autofocus
        ></textarea>
        <button id="send-btn" type="submit" aria-label="Gửi">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M3.4 20.4 20.85 12 3.4 3.6l-.01 6.53L15 12 3.39 13.87z"/>
          </svg>
        </button>
      </form>
      <p class="hint">Enter để gửi · Shift+Enter để xuống dòng</p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
